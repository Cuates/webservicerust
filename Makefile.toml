[config]
skip_core_tasks = true
default_to_workspace = false

[env]
CARGO_MAKE_WORKSPACE_SKIP_MEMBERS = true

[tasks.help]
workspace = false
description = "List all available tasks."
command = "cargo"
args = ["make", "--list-all-steps"]

[tasks.build]
workspace = false
description = "Build release binary (--locked)"
command = "cargo"
args = ["build", "--release", "--locked"]

[tasks.build-dev]
workspace = false
description = "Build debug binary"
command = "cargo"
args = ["build"]

[tasks.check]
workspace = false
description = "Run cargo check all crates"
command = "cargo"
args = ["check", "--workspace"]

[tasks.check-deadcode]
workspace = false
description = "Run cargo clippy to deny dead code across all crates"
command = "cargo"
args = ["clippy", "--workspace", "--", "-D", "dead_code"]

[tasks.lint-docs]
workspace = false
description = "Lint all project Markdown files via markdownlint-cli (requires Node.js / npx)"
script_runner = "@shell"
script = '''
npx --yes markdownlint-cli README.md CHANGELOG.md AGENTS.md SKILL.md START_HERE.md plan.md KNOWLEDGE_GRAPH.md docs/architecture.md docs/cargo-make.md docs/distribution.md docs/scaffolding.md docs/troubleshooting.md newsfeed/crates/newsfeed-config/README.md newsfeed/crates/newsfeed-constants/README.md newsfeed/crates/newsfeed-db/README.md newsfeed/crates/newsfeed-models/README.md newsfeed/crates/newsfeed-server/README.md newsfeed/crates/newsfeed-service/README.md
'''

[tasks.gen-openapi]
workspace = false
description = "Generate docs/openapi.json from the live utoipa spec (no server required). Safe to commit and import into Postman."
command = "cargo"
args = ["run", "--bin", "gen_openapi"]

[tasks.clean]
workspace = false
description = "Run cargo clean build artifacts"
command = "cargo"
args = ["clean"]

[tasks.fix]
workspace = false
description = "Format code and automatically fix clippy warnings"
script_runner = "@duckscript"
script = '''
exec cargo fmt --all
exec cargo clippy --workspace --fix --allow-dirty --allow-staged -- -D warnings
'''

[tasks.info]
workspace = false
description = "Print formatted environment and project information"
script_runner = "@duckscript"
script = '''
out = exec rustc --version
rustc_version = trim ${out.stdout}

out = exec cargo --version
cargo_version = trim ${out.stdout}

out = exec rustup show active-toolchain
toolchain = trim ${out.stdout}

echo " "
echo "[✔] Environment"
echo "    - OS: ${CARGO_MAKE_RUST_TARGET_OS} ${CARGO_MAKE_RUST_TARGET_ENV} (${CARGO_MAKE_RUST_TARGET_ARCH})"
echo "    ✔ rustc: ${rustc_version}"
echo "    ✔ cargo: ${cargo_version}"
echo "    ✔ Rust toolchain: ${toolchain}"
echo " "
echo "[-] Workspace Packages"
exec cargo tree --depth 0 --workspace
echo " "
'''

[tasks.audit]
workspace = false
description = "Run cargo audit for vulnerabilities"
command = "cargo"
args = [
    "audit",
    # Ignored because `tiberius = "0.12.3"` is locked to `rustls 0.21` which relies on older webpki/pemfile versions.
    # Future Plan: Remove these once `tiberius` updates to `rustls >= 0.22` or `0.23`.
    "--ignore", "RUSTSEC-2026-0098", 
    "--ignore", "RUSTSEC-2026-0099", 
    "--ignore", "RUSTSEC-2026-0104", 
    "--ignore", "RUSTSEC-2025-0134",
    # Ignored because `tiberius = "0.12.3"` depends on `winauth` -> `rand = "0.7.3"`.
    "--ignore", "RUSTSEC-2026-0097",
    # Ignored because `sqlx = "0.8.6"` transitively depends on `rsa = "0.9.10"`, which has no fixed upgrade available yet.
    "--ignore", "RUSTSEC-2023-0071",
    # Ignored because `sqlx = "0.8.6"` transitively depends on `event-listener = "5.4.1"`.
    "--ignore", "RUSTSEC-2026-0221",
]

[tasks.machete]
workspace = false
description = "Check for unused dependencies across the workspace"
command = "cargo"
args = ["machete"]

[tasks.check-docker]
workspace = false
description = "Verify Docker Desktop is running before executing tests that require containers."
script_runner = "@duckscript"
script = '''
out = exec docker ps
is_empty = is_empty ${out.stdout}
if ${is_empty}
    echo "Error: Docker Desktop is not running. Please start it to run integration tests."
    exit 1
else
    echo "[✔] Docker Desktop is running."
end
'''

[tasks.test]
workspace = false
description = "Run all workspace tests"
dependencies = ["check-docker"]
command = "cargo"
args = ["test", "--workspace", "--", "--include-ignored"]

[tasks.test-coverage]
workspace = false
description = "Run tests, print coverage summary, and generate lcov.info"
run_task = { name = ["check-docker", "test-coverage-run", "test-coverage-report"] }

[tasks.test-coverage-run]
command = "cargo"
args = ["llvm-cov", "--workspace", "--all-features", "--ignore-filename-regex", ".*(main|gen_openapi|shutdown)\\.rs", "--fail-under-lines", "99", "--fail-under-functions", "99", "--", "--include-ignored"]

[tasks.test-coverage-report]
command = "cargo"
args = ["llvm-cov", "report", "--lcov", "--ignore-filename-regex", ".*(main|gen_openapi|shutdown)\\.rs", "--output-path", "lcov.info"]

[tasks.docker-build]
workspace = false
description = "Build Docker image"
command = "docker"
args = ["compose", "build"]

[tasks.docker-up]
workspace = false
description = "Start containers (detached)"
command = "docker"
args = ["compose", "up", "-d"]

[tasks.docker-down]
workspace = false
description = "Stop containers"
command = "docker"
args = ["compose", "down"]

[tasks.clean-test-containers]
workspace = false
description = "Safely force-remove ONLY orphaned testcontainers (ignores personal containers)"
script_runner = "@duckscript"
script = '''
out = exec docker ps -a -q --filter "label=org.testcontainers=true"
is_empty = is_empty ${out.stdout}
if ${is_empty}
    echo "No orphaned testcontainers found. Your personal containers are untouched."
else
    echo "Found orphaned testcontainers. Removing..."
    exec docker rm -f ${out.stdout}
    echo "Cleaned up orphaned testcontainers."
end
'''

[tasks.docker-restart]
workspace = false
description = "Restart containers"
script_runner = "@duckscript"
script = '''
exec docker compose down
exec docker compose up -d
'''

[tasks.docker-logs]
workspace = false
description = "Follow container logs"
command = "docker"
args = ["compose", "logs", "-f", "newsfeed-server"]

[tasks.key-gen]
workspace = false
description = "Generate a new API key"
windows_alias = "key-gen-win"
linux_alias = "key-gen-nix"
mac_alias = "key-gen-nix"

[tasks.key-gen-win]
workspace = false
script_runner = "@shell"
script = '''
powershell -ExecutionPolicy Bypass -File .\scripts\generate-api-key.ps1
'''

[tasks.key-gen-nix]
workspace = false
script_runner = "@duckscript"
script = '''
exec bash scripts/generate-api-key.sh
'''

[tasks.key-revoke]
workspace = false
description = "Revoke an existing API key"
windows_alias = "key-revoke-win"
linux_alias = "key-revoke-nix"
mac_alias = "key-revoke-nix"

[tasks.key-revoke-win]
workspace = false
script_runner = "@shell"
script = '''
powershell -ExecutionPolicy Bypass -File .\scripts\revoke-api-key.ps1
'''

[tasks.key-revoke-nix]
workspace = false
script_runner = "@duckscript"
script = '''
exec bash scripts/revoke-api-key.sh
'''

[tasks.use-postgres]
workspace = false
description = "Switch active database backend to PostgreSQL"
script_runner = "@rust"
script = '''
fn main() {
    let content = std::fs::read_to_string(".env").unwrap();
    let mut new_content = String::new();
    for line in content.lines() {
        if line.starts_with("DATABASE_TARGET=") {
            new_content.push_str("DATABASE_TARGET=postgres\n");
        } else {
            new_content.push_str(line);
            new_content.push('\n');
        }
    }
    std::fs::write(".env", new_content).unwrap();
    println!("Switched active database target to: postgres");
}
'''

