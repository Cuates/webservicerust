name: Newsfeed CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'newsfeed/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/newsfeed-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'newsfeed/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/newsfeed-ci.yml'

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  check:
    name: Check, Lint, and Unit Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Newsfeed Environment
        uses: ./.github/actions/newsfeed-setup
        
      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Check Unused Dependencies
        run: cargo machete

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Cargo Audit
        run: |
          # RUSTSEC-2023-0071: rsa crate Marvin Attack timing side-channel (transitive via tiberius/sqlx)
          # RUSTSEC-2026-0097: webpki cert validation advisory in older rustls 0.21 (transitive via tiberius 0.12)
          # RUSTSEC-2026-0098: rustls-pemfile parsing advisory (transitive via tiberius 0.12)
          # RUSTSEC-2026-0099: sct certificate timestamp advisory (transitive via tiberius 0.12)
          # RUSTSEC-2026-0104: idna domain name handling advisory (transitive via tiberius 0.12 / older url)
          # RUSTSEC-2025-0134: rustls 0.21 TLS stack advisory (transitive via tiberius 0.12)
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0097 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2025-0134

      - name: Cargo Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace --lib --bins -- --include-ignored

  integration-test:
    name: Integration Tests (${{ matrix.database_target }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        database_target: [postgres, mariadb, mssql]

    env:
      DATABASE_TARGET: ${{ matrix.database_target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Newsfeed Environment
        uses: ./.github/actions/newsfeed-setup
        
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run Integration Tests & Enforce Coverage
        run: cargo llvm-cov --workspace --all-features --ignore-filename-regex ".*main\.rs" --fail-under-lines 99 --fail-under-functions 99 -- --include-ignored
